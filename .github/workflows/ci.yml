name: Help Radius CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ main, develop, 'fix/**', 'feature/**' ]

jobs:
  test-and-build:
    name: Test & Build Services
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Verify Backend Server Startup & Healthcheck
        working-directory: ./backend
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          curl --fail http://localhost:5000/api/health || exit 1
          kill $SERVER_PID

      - name: Build Docker Production Images
        run: |
          docker compose build
